<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus Contatos</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{--bg:#f1f5f9;--card:#fff;--p:#2563eb;--pd:#1d4ed8;--txt:#0f172a;--mut:#64748b;--bd:#e2e8f0;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top right,rgba(37,99,235,.12),transparent 32%),var(--bg);color:var(--txt)}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}
.hidden{display:none!important}.app{width:min(100%,780px);margin:auto;padding:18px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 12px 32px rgba(15,23,42,.08);padding:18px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),#60a5fa);color:#fff;font-size:23px}
h1{font-size:clamp(23px,5vw,30px)}.sub{color:var(--mut);font-size:13px;margin-top:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{min-height:46px;border-radius:13px;padding:0 16px;font-weight:800}
.primary{background:var(--p);color:#fff}.secondary{background:#e2e8f0;color:#334155}.danger{background:#fee2e2;color:var(--danger)}
.user{display:flex;align-items:center;gap:10px}.user img{width:38px;height:38px;border-radius:50%}.user small{display:block;color:var(--mut)}
.login{min-height:70vh;display:grid;place-items:center;text-align:center}.loginbox{width:min(100%,420px)}.loginbox p{color:var(--mut);margin:10px 0 22px;line-height:1.5}
.grid{display:grid;gap:13px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--bd);border-radius:13px;background:#f8fafc;padding:13px 14px;outline:none}.field input{min-height:49px}.field textarea{min-height:150px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(37,99,235,.1);background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.search{width:100%;min-height:46px;border:1px solid var(--bd);border-radius:13px;padding:0 14px;margin:10px 0 14px}
.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:16px;padding:13px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:var(--pd);font-weight:900;flex:0 0 auto}.data{min-width:0;flex:1}.name{font-weight:800}.phone,.preview{color:var(--mut);font-size:13px;margin-top:4px}.preview{color:var(--pd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemActions{display:flex;gap:7px}.icon{width:39px;height:39px;border-radius:11px;background:#dbeafe;color:var(--pd)}.empty{text-align:center;color:var(--mut);padding:30px 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);opacity:0;color:#fff;padding:14px 18px;border-radius:13px;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}
@media(min-width:600px){.app{padding:28px 20px}.grid.two{grid-template-columns:1fr .75fr}}
</style></head>
<body>
<section id="loginScreen" class="login"><div class="card loginbox"><div class="logo" style="margin:auto">☎</div><h1 style="margin-top:14px">Meus Contatos</h1><p>Entre com sua conta Google. Cada usuário verá somente os próprios contatos e mensagens.</p><div id="g_id_onload" data-client_id="COLE_AQUI_SEU_CLIENT_ID.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div><div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular"></div></div></section>
<main id="appScreen" class="app hidden">
<header class="top"><div class="brand"><div class="logo">☎</div><div><h1>Meus Contatos</h1><p class="sub">Área individual e protegida</p></div></div><div class="user"><img id="userPhoto" alt=""><div><strong id="userName"></strong><small id="userEmail"></small></div></div></header>
<nav class="nav"><button class="btn primary" onclick="location.href='index.html'">📇 Contatos</button><button class="btn secondary" onclick="location.href='mensageria.html'">✉ Mensageria</button><button class="btn danger" onclick="logout()">Sair</button></nav>
<section class="card"><h2 id="formTitle">Novo contato</h2><form id="contactForm"><input type="hidden" id="contactId"><div class="grid two" style="margin-top:14px"><div class="field"><label>Nome</label><input id="name" required maxlength="100"></div><div class="field"><label>Telefone</label><input id="phone" required maxlength="20"></div></div><div class="actions"><button class="btn primary">Salvar contato</button><button type="button" id="cancelBtn" class="btn secondary hidden" onclick="clearForm()">Cancelar</button></div></form></section>
<section class="card"><h2>Contatos cadastrados</h2><input id="search" class="search" placeholder="Buscar contato..."><div id="list" class="list"><div class="empty">Carregando...</div></div></section>
</main><div id="toast" class="toast"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyI0xEx-_GfprPhixOQRSkD_17w9N7gvQpmVCVA24n-phedpXTkESZGbuiNHaiwX8DddA/exec";
const GOOGLE_CLIENT_ID = "COLE_AQUI_SEU_CLIENT_ID.apps.googleusercontent.com";
let googleCredential = "";
let currentUser = null;

function handleCredentialResponse(response){
  googleCredential = response.credential;
  sessionStorage.setItem("googleCredential", googleCredential);
  validateSession();
}

async function validateSession(){
  googleCredential = sessionStorage.getItem("googleCredential") || googleCredential;
  if(!googleCredential) return showLogin();

  try{
    const r = await api({action:"session"}, false);
    currentUser = r.user;
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");
    document.getElementById("userName").textContent = currentUser.name || currentUser.email;
    document.getElementById("userEmail").textContent = currentUser.email;
    if(currentUser.picture) document.getElementById("userPhoto").src = currentUser.picture;
    afterLogin();
  }catch(e){
    logout(false);
  }
}

function showLogin(){
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("appScreen").classList.add("hidden");
}

function logout(reload=true){
  googleCredential="";
  currentUser=null;
  sessionStorage.removeItem("googleCredential");
  if(window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
  if(reload) location.reload(); else showLogin();
}

async function api(payload, includeToken=true){
  const body = {...payload};
  if(includeToken || payload.action==="session") body.credential = googleCredential;
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body)
  });
  const data = await res.json();
  if(!data.success) throw new Error(data.message || "Erro na operação.");
  return data;
}

function toastMsg(msg,type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),3000);
}

function initials(name){
  const p=String(name||"").trim().split(/\s+/).filter(Boolean);
  return p.length>1?(p[0][0]+p[p.length-1][0]).toUpperCase():(p[0]||"?").slice(0,2).toUpperCase();
}

let contacts=[];
function afterLogin(){loadContacts();}
async function loadContacts(){try{const r=await api({action:"listar"});contacts=r.data||[];render(contacts);}catch(e){toastMsg(e.message,"err");}}
document.getElementById("contactForm").addEventListener("submit",async e=>{e.preventDefault();try{await api({action:"salvar",id:contactId.value,nome:name.value.trim(),telefone:phone.value.trim()});toastMsg("Contato salvo.");clearForm();loadContacts();}catch(err){toastMsg(err.message,"err");}});
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase();render(contacts.filter(c=>String(c.nome).toLowerCase().includes(q)||String(c.telefone).toLowerCase().includes(q)));});
function render(list){document.getElementById("list").innerHTML=list.length?list.map(c=>`<article class="item"><div class="avatar">${initials(c.nome)}</div><div class="data"><div class="name">${escapeHtml(c.nome)}</div><div class="phone">${escapeHtml(c.telefone)}</div></div><div class="itemActions"><button class="icon" onclick="editContact('${c.id}')">✎</button><button class="icon danger" onclick="deleteContact('${c.id}')">🗑</button></div></article>`).join(""):'<div class="empty">Nenhum contato cadastrado.</div>';}
function editContact(id){const c=contacts.find(x=>String(x.id)===String(id));if(!c)return;contactId.value=c.id;name.value=c.nome;phone.value=c.telefone;formTitle.textContent="Editar contato";cancelBtn.classList.remove("hidden");scrollTo({top:0,behavior:"smooth"});}
function clearForm(){contactForm.reset();contactId.value="";formTitle.textContent="Novo contato";cancelBtn.classList.add("hidden");}
async function deleteContact(id){if(!confirm("Excluir este contato?"))return;try{await api({action:"excluir",id});toastMsg("Contato excluído.");loadContacts();}catch(e){toastMsg(e.message,"err");}}
function escapeHtml(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
window.onload=validateSession;
</script></body></html>
